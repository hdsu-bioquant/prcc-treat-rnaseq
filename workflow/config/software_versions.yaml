# pRCC-TREAT-RNA-Seq pinned software/container manifest.
#
# This file is the workflow-owned source of truth for container URIs and the
# software versions reported in results/run/software_versions.tsv and MultiQC.
# Version probing of every container is deliberately kept out of production DAGs;
# release/integration tests can verify these declarations separately.

schema_version: 1

tools:
  star:
    software: "STAR"
    version: "2.7.5c"
    uri: "docker://quay.io/biocontainers/star:2.7.5c--0"
    version_probe: "STAR --version"
    pull_default: true

  fastqc:
    software: "FastQC"
    version: "0.12.1"
    uri: "docker://quay.io/biocontainers/fastqc:0.12.1--hdfd78af_0"
    version_probe: "fastqc --version"
    pull_default: true

  multiqc:
    software: "MultiQC"
    version: "1.21"
    uri: "docker://quay.io/biocontainers/multiqc:1.21--pyhdfd78af_0"
    version_probe: "multiqc --version"
    pull_default: true

  fastp:
    software: "fastp"
    version: "0.23.4"
    uri: "docker://quay.io/biocontainers/fastp:0.23.4--hadf994f_2"
    version_probe: "fastp --version"
    pull_default: true

  bbmap:
    software: "BBMap / BBDuk"
    version: "39.06"
    uri: "docker://quay.io/biocontainers/bbmap:39.06--h92535d8_0"
    version_probe: "bbversion.sh"
    pull_default: true

  umitools:
    software: "UMI-tools"
    version: "1.1.6"
    uri: "docker://quay.io/biocontainers/umi_tools:1.1.6--py39hbcbf7aa_0"
    # Stable maintained local filename. Existing images are version-probed before reuse.
    local_sif: "umitools.sif"
    # Optional pull-time sanity probe. The pull helper checks that the image
    # actually reports the manifest-declared version before accepting it.
    version_probe: "umi_tools --version"
    pull_default: true

  samtools:
    software: "samtools"
    version: "1.19"
    uri: "docker://quay.io/biocontainers/samtools:1.19--h50ea8bc_0"
    version_probe: "samtools --version | head -n 1"
    pull_default: true

  htseq:
    software: "HTSeq"
    version: "2.0.9"
    uri: "docker://quay.io/biocontainers/htseq:2.0.9--py39h918f1d6_0"
    version_probe: "htseq-count --version"
    pull_default: true

  py:
    software: "pandas"
    version: "1.5.2"
    uri: "docker://quay.io/biocontainers/pandas:1.5.2"
    version_probe: "python -c 'import pandas; print(pandas.__version__)'"
    pull_default: true

  rseqc:
    software: "RSeQC"
    version: "5.0.3"
    uri: "docker://quay.io/biocontainers/rseqc:5.0.3--py39hf95cd2a_0"
    pull_default: false

  arriba:
    software: "Arriba"
    version: "1.1.0"
    uri: "docker://quay.io/biocontainers/arriba:1.1.0--h2e03b76_3"
    pull_default: false

  starfusion:
    software: "STAR-Fusion"
    version: "1.6.0"
    uri: "docker://trinityctat/starfusion:1.6.0"
    pull_default: false

  tetx:
    software: "TEtranscripts"
    version: "2.2.3"
    uri: "docker://quay.io/biocontainers/tetranscripts:2.2.3--pyhdfd78af_0"
    pull_default: false

  gatk:
    software: "GATK"
    version: "4.5.0.0"
    uri: "docker://broadinstitute/gatk:4.5.0.0"
    pull_default: false
