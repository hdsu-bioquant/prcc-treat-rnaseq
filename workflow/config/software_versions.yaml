# pRCC-RNA-Seq pinned software/container manifest.
#
# This file is the workflow-owned source of truth for container URIs and the
# software versions reported in results/run/software_versions.tsv and MultiQC.
# Version probing of every container is deliberately kept out of production DAGs;
# release/integration tests can verify these declarations separately.

schema_version: 1

tools:
  star:
    software: "STAR"
    version: "2.7.5c"
    uri: "docker://quay.io/biocontainers/star:2.7.5c--0"
    pull_default: true

  fastqc:
    software: "FastQC"
    version: "0.12.1"
    uri: "docker://quay.io/biocontainers/fastqc:0.12.1--hdfd78af_0"
    pull_default: true

  multiqc:
    software: "MultiQC"
    version: "1.21"
    uri: "docker://quay.io/biocontainers/multiqc:1.21--pyhdfd78af_0"
    pull_default: true

  fastp:
    software: "fastp"
    version: "0.23.4"
    uri: "docker://quay.io/biocontainers/fastp:0.23.4--hadf994f_2"
    pull_default: true

  bbmap:
