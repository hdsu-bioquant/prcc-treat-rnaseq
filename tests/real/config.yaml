#==============================================================================#
# RNA-Seq-pRCC — unified, GDC-aligned RNA-seq pipeline (multi-site pRCC)
#==============================================================================#
# Standardized to the NCI GDC mRNA Analysis pipeline (Data Release 32+):
#   - Reference  : GRCh38.d1.vd1
#   - Annotation : GENCODE v36
#   - Aligner    : STAR 2.7.5c, two-pass (--twopassMode Basic)
#   - Counts     : STAR --quantMode GeneCounts (unstranded column = GDC headline)
#   - FL Norm    : FPKM, FPKM-UQ, TPM columns in canonical per-library output
# Refs: https://docs.gdc.cancer.gov/Data/Bioinformatics_Pipelines/Expression_mRNA_Pipeline/
#       https://github.com/NCI-GDC/gdc-rnaseq-cwl
#==============================================================================#

# ---- Sample sheet ----------------------------------------------------------#
# One row = one sequencing library. Required technical columns:
# library_id, sample_id, assay, layout, strandedness, fq1, fq2,
# has_umi, umi_pattern, umi_location. Extra metadata columns are allowed.
samples: tests/real/samples.tsv

# ---- Output / scratch ------------------------------------------------------#
output: tests/real/output
tmpdir:  tests/real/output/intermediate/tmp

# ---- GDC reference resources (exact GDC files; see resources/get_gdc_references.sh)
reference:
  # Set to a directory holding the GDC reference files. If download_references is
  # true, the references.smk rules fetch them here from the GDC Data Portal.
  dir: resources/gdc
  download_references: false   # true = download GDC reference files (requires internet access)
  genome_fasta_tar_url:  "https://api.gdc.cancer.gov/data/254f697d-310d-4d7d-a27b-27fbf767a834"   # GRCh38.d1.vd1.fa.tar.gz  md5 3ffbcfe2d05d43206f57f81ebb251dc9
  star_index_tgz_url:    "https://api.gdc.cancer.gov/data/c0008693-0583-4eac-bd5c-583070763893"   # star-2.7.5c_GRCh38.d1.vd1_gencode.v36.tgz  md5 acafb76bba5e3e80eb028dc05f002ffc
  gtf_gz_url:            "https://api.gdc.cancer.gov/data/be002a2c-3b27-43f3-9e0f-fd47db92a6b5"   # gencode.v36.annotation.gtf.gz  md5 c03931958d4572148650d62eb6dec41a
  genome_fasta: GRCh38.d1.vd1.fa
  gtf:          gencode.v36.annotation.gtf
  star_index:   star-2.7.5c_GRCh38.d1.vd1_gencode.v36
  sjdb_overhang: 100        # GDC builds the shipped index with sjdbOverhang 100

# ---- STAR (GDC DR32+ parameter recipe; do not change for GDC adherence) ----#
star:
  threads: 8
  # Verbatim GDC mRNA STAR flags (paired-end). SE branch drops PE-only behavior.
  gdc_params: >-
    --alignIntronMax 1000000 --alignIntronMin 20 --alignMatesGapMax 1000000
    --alignSJDBoverhangMin 1 --alignSJoverhangMin 8 --alignSoftClipAtReferenceEnds Yes
    --chimJunctionOverhangMin 15 --chimMainSegmentMultNmax 1
    --chimOutType Junctions SeparateSAMold WithinBAM SoftClip --chimSegmentMin 15
    --genomeLoad NoSharedMemory --limitSjdbInsertNsj 1200000
    --outFilterIntronMotifs None --outFilterMatchNminOverLread 0.33
    --outFilterMismatchNmax 999 --outFilterMismatchNoverLmax 0.1
    --outFilterMultimapNmax 20 --outFilterScoreMinOverLread 0.33
    --outFilterType BySJout --outSAMattributes NH HI AS nM NM ch
    --outSAMstrandField intronMotif --outSAMtype BAM Unsorted --outSAMunmapped Within
    --quantMode TranscriptomeSAM GeneCounts --twopassMode Basic

# ---- Full-length poly-A branch -----------------------#
full_length:
  # GDC does NOT trim adapters (relies on STAR soft-clipping). Default off for
  # GDC adherence; set true to enable fastp.
  trim_adapters: false

# ---- QuantSeq branch -------------------------------------------------------#
# UMI presence/pattern/location and strandedness are library-level properties in
# samples.tsv, not global QuantSeq settings.
quantseq:
  bbduk_polyA: true            # poly(A) + adapter right-trim (BBDuk)

# ---- Optional modules (full-length branch only; off by default) ------------#
modules:
  fusion:  false   # Arriba v1.1.0 + STAR-Fusion (GDC fusion tools)
  te:      false   # TEcount (TEtranscripts)
  ase:     false   # GATK ASEReadCounter (requires externally supplied germline VCF)
  rseqc:   false   # RSeQC QC (PE full-length only; needs the GENCODE BED12)

# Optional CTAT lib dir for STAR-Fusion (set when modules.fusion: true)
ctat_genome_lib: ""

# Optional TE annotation GTF for TEcount (set when modules.te: true)
te_gtf: ""

# Optional germline VCF (per sample) for ASE (set when modules.ase: true)
ase_germline_vcf: ""
