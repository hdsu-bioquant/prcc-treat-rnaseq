# profiles/local/config.yaml — single workstation + Apptainer (example: 96 GB / 32 cores)
# Usage: snakemake --profile profiles/local --configfile /path/to/run/config.yaml
# Tune `cores`/`resources.mem_mb` to the machine. The human STAR index needs ~30 GB RAM,
# so keep concurrent STAR jobs low on a 96 GB box (e.g. cores: 16, one STAR at a time).
cores: 16
jobs: 16
latency-wait: 60
rerun-incomplete: true
printshellcmds: true
rerun-triggers: "mtime"

software-deployment-method:
  - apptainer
# Bind the project root so containers can read the validation data (../Pipeline_Validation)
# and the references, and write results.
apptainer-args: "--bind /path/to/project-storage"

default-resources:
  - mem_mb=8000
  - runtime=240
