#==============================================================================#
# pRCC-RNA-Seq — realistic public-data qualification run configuration
#==============================================================================#
# Maintainer-owned qualification definition.
#
# For the qualification exercise, COPY this file to a fresh run directory and
# edit ONLY the fields explicitly marked "SITE/RUN EDIT" below. Do not run the
# maintained file in tests/real/ directly and do not change harmonization values.
#==============================================================================#

# This test deliberately exercises consortium-specific reference enforcement.
consortium_run: true

# SITE/RUN EDIT: absolute path to the COPIED samples.tsv in the qualification run.
samples: /EDIT/ABSOLUTE/PATH/TO/qualification-run/samples.tsv

# SITE/RUN EDIT: output owned by this qualification run.
output: /EDIT/ABSOLUTE/PATH/TO/qualification-run/output

# Optional site-specific scratch can be added after copying, if needed:
# tmpdir: /path/to/fast/scratch/pRCC-RNA-Seq-real-qualification

reference:
  mode: gdc
  # SITE/RUN EDIT: absolute path to the site's pre-installed GDC bundle.
  dir: /EDIT/ABSOLUTE/PATH/TO/gdc
  genome_fasta: GRCh38.d1.vd1.fa
  gtf: gencode.v36.annotation.gtf
  star_index: star-2.7.5c_GRCh38.d1.vd1_gencode.v36
  sjdb_overhang: 100

star:
  # Execution/resource setting. For qualification, keep 8 unless the site profile
  # or scheduler requires a documented alternative; scientific STAR flags stay fixed.
  threads: 8
  gdc_params: >-
    --alignIntronMax 1000000 --alignIntronMin 20 --alignMatesGapMax 1000000
    --alignSJDBoverhangMin 1 --alignSJoverhangMin 8 --alignSoftClipAtReferenceEnds Yes
    --chimJunctionOverhangMin 15 --chimMainSegmentMultNmax 1
    --chimOutType Junctions SeparateSAMold WithinBAM SoftClip --chimSegmentMin 15
    --genomeLoad NoSharedMemory --limitSjdbInsertNsj 1200000
    --outFilterIntronMotifs None --outFilterMatchNminOverLread 0.33
    --outFilterMismatchNmax 999 --outFilterMismatchNoverLmax 0.1
    --outFilterMultimapNmax 20 --outFilterScoreMinOverLread 0.33
    --outFilterType BySJout --outSAMattributes NH HI AS nM NM ch
    --outSAMstrandField intronMotif --outSAMtype BAM Unsorted --outSAMunmapped Within
    --quantMode TranscriptomeSAM GeneCounts --twopassMode Basic

full_length:
  trim_adapters: false

quantseq:
  bbduk_polyA: true

modules:
  fusion: false
  te: false
  ase: false
  rseqc: false

ctat_genome_lib: ""
te_gtf: ""
ase_germline_vcf: ""
